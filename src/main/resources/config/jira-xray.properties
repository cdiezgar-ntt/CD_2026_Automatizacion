# Jira
jira.host=${HOST}
jira.deployment.type=SERVER
jira.api.base=/rest/api/2

# Autenticacion
jira.auth.type=BEARER
jira.api.key=${JIRA_API_KEY}

# Proyecto
jira.project.key=${PROJECT}
jira.issue.type.testExecution=Test Execution
jira.issue.type.testSet=Test Set

# Xray Server/Data Center
xray.edition=SERVER_DC
xray.api.base=/rest/raven/1.0

# Plan de pruebas donde colgar la ejecucion
xray.testPlan.key=${TEST_PLAN_ID}

# Campos custom. Revisar en el Jira real.
# Si no los conoces todavia, dejalos vacios y usa el endpoint de Xray para asociar despues.
xray.customfield.testPlan=
xray.customfield.environment=

# Ejecucion
execution.name.prefix=Ejecución automatizada
execution.environment=PRE
execution.report.dir=test-output/ExtentReport

# Evidencias
evidence.content.type=text/html
evidence.status.default=PASS

# Comportamiento
publish.enabled=true
publish.createTestSet=false
publish.failOnMissingEvidence=false