# Activar reporter Spark
extent.reporter.spark.start=true

# Ruta del HTML
extent.reporter.spark.out=test-output/ExtentReport/report.html

# Config opcional
extent.reporter.spark.config=src/test/resources/spark-config.xml

# Base folder (opcional, pero recomendable)
extent.reporter.spark.basefolder.name=test-output/ExtentReport
extent.reporter.spark.basefolder.datetimepattern=yyyy-MM-dd_HH-mm-ss