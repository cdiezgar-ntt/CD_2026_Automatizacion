# ==========================================================
# 1. ACTIVACIÓN Y RUTA DEL REPORTE
# ==========================================================
# Le decimos que queremos generar el reporte "Spark" (el HTML moderno de ExtentReports)
extent.reporter.spark.start=true

# ¡Importante! Aquí le decimos que lo guarde en la raíz del proyecto, fuera de src/
extent.reporter.spark.out=test-output/SparkReport/Spark.html

# ==========================================================
# 2. DISEÑO Y APARIENCIA
# ==========================================================
# Puedes elegir el tema claro (STANDARD) o el oscuro (DARK)
extent.reporter.spark.config.theme=DARK

# El título que aparece en la pestaña del navegador
extent.reporter.spark.config.documentTitle=Reporte de Automatización - Wallet Provider

# El nombre grande que aparece dentro del reporte
extent.reporter.spark.config.reportName=Resultados de Ejecución (QA)

# ==========================================================
# 3. GESTIÓN DE CAPTURAS DE PANTALLA (¡Súper útil!)
# ==========================================================
# base64imagesrc=true es un truco de oro.
# Hace que las capturas de pantalla se incrusten directamente en el código del HTML.
# Ventaja: Puedes enviar el archivo Spark.html por Slack, Teams o Email,
# y la persona que lo abra verá las fotos sin necesidad de enviarle una carpeta adjunta con las imágenes.
base64imagesrc=true

# ==========================================================
# 4. INFORMACIÓN EXTRA DEL SISTEMA (Opcional)
# ==========================================================
# Puedes añadir variables que aparecerán en la sección "Dashboard" del reporte
systeminfo.Sistema Operativo=Windows / Linux
systeminfo.Entorno de Pruebas=QA
systeminfo.Navegador=Chrome
systeminfo.Autor=Tu Equipo de Automatización